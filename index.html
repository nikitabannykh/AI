async function api(path,body){
  const c=new AbortController(),t=setTimeout(()=>c.abort(),12000);
  try{
    const r=await fetch(path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body),signal:c.signal});
    const raw=await r.text();let j;try{j=JSON.parse(raw)}catch{throw Error('Сервер вернул некорректный ответ ('+r.status+')')};

function sectionHealth(key){
 const c=S.content;
 const req={roomDining:[['enabled','включён'],['hours','часы'],['serviceArea','зона доставки'],['leadTime','время доставки'],['orderChannel','канал заказа'],['items','позиции'],['photos','фото']],basics:[['description','описание'],['category','позиционирование'],['address','адрес'],['phone','телефон'],['email','email'],['languages','языки']],rooms:[['name','название'],['guests','вместимость'],['bed','кровать'],['view','вид'],['amenities','удобства'],['area','площадь'],['photos','фото']],restaurants:[['name','название'],['cuisine','кухня'],['hours','часы'],['mealPeriods','приёмы пищи'],['reservation','резервация'],['photos','фото']],menus:[['restaurant','ресторан'],['category','категория'],['name','название'],['description','описание'],['price','цена'],['ingredients','состав'],['allergens','аллергены'],['modifiers','модификаторы'],['photos','фото']],services:[['name','название'],['description','описание'],['hours','часы'],['price','цена'],['booking','как заказать'],['duration','длительность'],['photos','фото']],facilities:[['name','название'],['category','категория'],['details','описание'],['hours','часы'],['rules','правила'],['photos','фото']],policies:[['children','дети'],['minimumAge','минимальный возраст'],['cancellation','отмена'],['parking','парковка'],['deposit','депозит'],['accessibility','доступность']],faqs:[['q','вопрос'],['a','ответ'],['category','категория'],['source','источник']],nearby:[['name','название'],['type','тип'],['description','описание'],['travelTime','время в пути'],['bestFor','подходит для']]};
 const rows=Array.isArray(c[key])?c[key]:[c[key]||{}]; const need=req[key]||[]; let total=0,ok=0,gaps=[];
 rows.forEach((row,ri)=>need.forEach(([field,label])=>{total++;const val=row[field];const good=field==='photos'?Array.isArray(val)&&val.length>0:!!String(val??'').trim();if(good)ok++;else gaps.push((rows.length>1?'#'+(ri+1)+' · ':'')+label)}));
 return {pct:total?Math.round(ok/total*100):0,gaps};
}

function csvParse(text){
 const lines=text.replace(/\r/g,'').split('\n').filter(x=>x.trim());if(!lines.length)return[];
 const split=line=>{const out=[];let cur='',quote=false;for(let i=0;i<line.length;i++){const ch=line[i];if(ch==='"'){if(quote&&line[i+1]==='"'){cur+='"';i++;}else quote=!quote;}else if(ch===','&&!quote){out.push(cur.trim());cur='';}else cur+=ch}out.push(cur.trim());return out};
 const heads=split(lines[0]).map(x=>x.toLowerCase());return lines.slice(1).map(line=>{const vals=split(line),o={};heads.forEach((h,i)=>o[h]=vals[i]||'');return o});
}

async function initMarketMaps(){
 const root=$('marketMapCanvas');if(!root||typeof d3==='undefined'||typeof topojson==='undefined')return;
 try{
  const resp=await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json');if(!resp.ok)throw Error('map '+resp.status);const geo=await resp.json();
  const width=Math.max(600,root.clientWidth||760),height=Math.round(width*.52);root.innerHTML='';
  const svg=d3.select(root).append('svg').attr('viewBox','0 0 '+width+' '+height).attr('preserveAspectRatio','xMidYMid meet');
  const tooltip=d3.select(root).append('div').attr('class','map-tooltip');
  const countries=topojson.feature(geo,geo.objects.countries);const projection=d3.geoNaturalEarth1().fitSize([width,height],countries);const path=d3.geoPath(projection);
  const data=DEMO.markets.slice();const maxQ=Math.max(...data.map(function(x){return x.queries}),1);const byCode=Object.fromEntries(data.map(function(x){return [x.code,x]}));
  const byName={'United Kingdom':'GB','Germany':'DE','France':'FR','Poland':'PL','Czechia':'CZ','Czech Republic':'CZ','Cyprus':'CY'};
  const opacity=function(code){const q=byCode[code]?byCode[code].queries:0;return q?Math.max(.28,Math.min(1,.28+.72*q/maxQ)):.16};
  svg.append('rect').attr('width',width).attr('height',height).attr('rx',12).attr('fill','#f7f9fc');
  svg.append('path').datum({type:'Sphere'}).attr('d',path).attr('fill','#fbfcff').attr('stroke','#dfe3ea').attr('stroke-width',1);
  svg.append('g').selectAll('path').data(countries.features).join('path').attr('class','map-country').attr('d',path).attr('fill',function(d){const code=byName[d.properties&&d.properties.name];return code?'rgba(91,87,247,'+opacity(code).toFixed(2)+')':'#e8ebf1'}).on('mouseenter',function(ev,d){const code=byName[d.properties&&d.properties.name],x=code&&byCode[code];tooltip.style('display','block').style('left',(ev.offsetX+12)+'px').style('top',(ev.offsetY+12)+'px').html('<b>'+esc(d.properties&&d.properties.name||'Country')+'</b>'+(x?'<br>'+x.queries+' сценариев · '+x.mention+'% visibility · '+x.recommend+'% recommendation':'<br>Пока нет данных'))}).on('mousemove',function(ev){tooltip.style('left',(ev.offsetX+12)+'px').style('top',(ev.offsetY+12)+'px')}).on('mouseleave',function(){tooltip.style('display','none')});
  svg.append('path').datum(d3.geoGraticule10()).attr('d',path).attr('fill','none').attr('stroke','#e6e9ef').attr('stroke-width',.45).attr('opacity',.75);
 }catch(e){root.innerHTML='<div class="empty"><b>Не удалось загрузить карту мира</b><p>Проверьте соединение. Данные рынков не потеряны.</p></div>'}
}
