<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIHotel — AI-присутствие</title><style>
body{margin:0;background:#f5f7fb;color:#101828;font:14px system-ui,-apple-system,Segoe UI,sans-serif}.app{display:flex;min-height:100vh}.side{width:220px;background:#0b1730;color:#fff;padding:22px 15px;position:fixed;inset:0 auto 0 0}.brand{font-size:21px;font-weight:800;margin-bottom:25px}.nav button{display:block;width:100%;border:0;background:0;color:#bac4d8;text-align:left;padding:11px;border-radius:9px;margin:3px 0}.nav button.active,.nav button:hover{background:#fff1;color:#fff}.main{margin-left:220px;flex:1}header{height:68px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:5}.content{padding:25px;max-width:1500px;margin:auto}.title{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:18px}h1{margin:0;font-size:28px}h2{margin:0 0 6px}h3{margin:0 0 7px}.muted,.small{color:#667085;font-size:12px}.grid{display:grid;gap:14px}.five{grid-template-columns:repeat(5,1fr)}.two{grid-template-columns:1.15fr .85fr}.card{background:#fff;border:1px solid #e5e7eb;border-radius:15px;padding:17px}.kpi b{display:block;font-size:28px;margin-top:7px}.pill{display:inline-block;padding:5px 8px;border-radius:99px;font-size:10px;font-weight:800}.green{background:#e7f8f1;color:#07865c}.red{background:#fff0f0;color:#c83f3f}.orange{background:#fff4e5;color:#b96b10}.btn{border:1px solid #d9dce4;background:#fff;padding:9px 13px;border-radius:9px;font-weight:700;cursor:pointer}.primary{background:#5b57f7;border-color:#5b57f7;color:#fff}.btn:disabled{opacity:.5}.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.filters input,.filters select,.custom input,.custom select,.form input,.form select{border:1px solid #d8dde6;border-radius:9px;padding:9px;background:#fff}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px 8px;border-bottom:1px solid #eef0f4;text-align:left;font-size:11px}.query{cursor:pointer}.query:hover{background:#fafbff}.detail{display:none;background:#fafbff}.detail.open{display:table-row}.runs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:10px}.run{background:#fff;border:1px solid #e5e7eb;border-radius:9px;padding:9px}.run b{display:block;font-size:11px}.run span{display:block;font-size:10px;margin-top:4px}.source{padding:10px 0;border-bottom:1px solid #eef0f4}.source a{color:#4b49d9;text-decoration:none;font-weight:700}.custom{margin-top:15px}.custom .row{display:grid;grid-template-columns:1.8fr 1fr 1fr 1fr auto;gap:8px;margin-top:10px}.custom-result{margin-top:10px;padding:12px;background:#fafbff;border:1px solid #e5e7eb;border-radius:12px}.crgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:9px}.cr{background:#fff;border:1px solid #edf0f4;border-radius:9px;padding:9px}.cr b{display:block;font-size:16px;margin-top:4px}.setup{max-width:850px;margin:65px auto;padding:20px}.hero{background:#0b1730;color:#fff;border-radius:20px;padding:32px}.hero h1{font-size:39px;line-height:1.03;margin:18px 0}.hero p{color:#bdc7db;line-height:1.55}.form{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:24px;margin:-20px 18px 0;box-shadow:0 12px 30px #10182812}.field{margin:14px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.form input{width:100%;padding:11px}.status{margin-top:10px}.error{color:#c83f3f}.loading{padding:12px 0}.empty{padding:25px;color:#667085;text-align:center;border:1px dashed #d5dbe5;border-radius:12px}@media(max-width:1050px){.five,.two{grid-template-columns:1fr 1fr}.side{width:190px}.main{margin-left:190px}.custom .row{grid-template-columns:1fr}}@media(max-width:700px){.side{display:none}.main{margin:0}.five,.two{grid-template-columns:1fr}.content{padding:15px}.title{display:block}.runs{grid-template-columns:repeat(2,1fr)}.crgrid{grid-template-columns:repeat(2,1fr)}}
</style><body><div id="app"></div><script>
const S={hotel:null,audit:null,key:localStorage.getItem('aihotel-openai-key')||'',marketCountry:'CY',marketCity:'',from:'',to:'',filterCountry:'ALL'};
const C=[['CY','Кипр'],['CZ','Чехия'],['GR','Греция'],['DE','Германия'],['GB','Великобритания'],['FR','Франция'],['ES','Испания'],['IT','Италия'],['TR','Турция'],['AE','ОАЭ'],['US','США'],['RU','Россия']];const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const pct=(a,b)=>b?Math.round(a/b*100):0;
async function api(path,body){const r=await fetch(path,{method:'POST',headers:{'content-type':'application/json',...(S.key?{'x-openai-api-key':S.key}:{})},body:JSON.stringify(body)});const raw=await r.text();let j;try{j=JSON.parse(raw)}catch{throw Error('Сервер вернул некорректный ответ ('+r.status+'). Ответ: '+raw.slice(0,180).replace(/\\s+/g,' '))}if(!r.ok)throw Error(j.error||('Ошибка API ('+r.status+')'));return j}
function setup(){return `<div class="setup"><div class="hero"><div class="brand">AIHotel</div><h1>Узнайте, как AI видит ваш отель.</h1><p>Введите только официальный сайт. Система сама определит отель, построит релевантные запросы и проверит их через реальный web search.</p></div><div class="form"><div class="field"><label>Официальный сайт отеля</label><input id="url" placeholder="https://www.examplehotel.com"></div><div class="field"><div class="small">Сейчас работаем без API-ключа: проверяем реальную публичную web-выдачу. Подключение AI-моделей добавим отдельным режимом.</div></div><button class="btn primary" id="go">Найти данные →</button><div id="st" class="status"></div></div></div>`}
function review(){const h=S.hotel||{};return `<div class="setup"><div class="card"><h2>Проверьте найденный отель</h2><p class="small">Мы не просим вручную вводить город и данные — сначала определяем их по сайту.</p><div class="grid two"><div><b>Название</b><div class="small">${esc(h.name)}</div></div><div><b>Город</b><div class="small">${esc(h.city||'Не определён')}</div></div><div><b>Страна</b><div class="small">${esc(h.country||'Не определена')}</div></div><div><b>Домен</b><div class="small">${esc(h.host)}</div></div></div><div class="card" style="margin-top:14px;background:#fafbff;box-shadow:none"><h3>География benchmark</h3><div class="small">Это страна/город тестового поиска, а не реальная география пользователей ChatGPT.</div><div class="row" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px"><select id="mc">${C.map(x=>`<option value="${x[0]}" ${x[0]===S.marketCountry?'selected':''}>${x[1]}</option>`).join('')}</select><input id="city" value="${esc(S.marketCity||h.city||'')}" placeholder="Город, например Айя-Напа"></div><div class="field"><label>Проверок каждого запроса</label><select id="rp"><option value="1" selected>1</option></select><div class="small">Публичный web benchmark сейчас выполняется один раз на запрос.</div></div></div><div style="display:flex;justify-content:space-between;margin-top:15px"><button class="btn" id="back">← Назад</button><button class="btn primary" id="audit">Запустить реальный benchmark →</button></div></div></div>`}
function runsFor(q,rows){return rows.filter(r=>r.query===q)}function clientStats(rows){const ok=rows.filter(r=>r.status==='ok'),n=ok.length,m=ok.filter(r=>r.result?.mentioned).length,re=ok.filter(r=>r.result?.recommended).length,c=ok.filter(r=>r.result?.officialCitation).length,p=ok.map(r=>r.result?.position).filter(Number.isFinite);return {totalRuns:n,mentionCount:m,mentionRate:pct(m,n),recommendationCount:re,recommendationRate:pct(re,n),officialCitationCount:c,officialCitationRate:pct(c,n),averagePosition:p.length?Number((p.reduce((a,b)=>a+b,0)/p.length).toFixed(1)):null}}
function dashboard(){const rows=(S.audit?.results||[]).filter(r=>{const d=new Date(r.checkedAt||r.observedAt||0);const from=S.from?new Date(S.from+'T00:00:00'):new Date('2000-01-01');const to=S.to?new Date(S.to+'T23:59:59'):new Date('2999-01-01');return d>=from&&d<=to&&(S.filterCountry==='ALL'||r.market?.countryCode===S.filterCountry)});const qs=[...new Set(rows.map(r=>r.query))];const agg=clientStats(rows);const src=[...new Map(rows.flatMap(r=>r.citations||[]).filter(x=>x.url).map(x=>[x.url,x])).values()].slice(0,12);return `<div class="app"><aside class="side"><div class="brand">AIHotel</div><div class="nav"><button class="active">⌂ Дашборд</button><button>⌕ Запросы</button><button>⚠ Проблемы</button></div></aside><main class="main"><header><strong>${esc(S.hotel.name)}</strong><button class="btn" id="new">↻ Новый аудит</button></header><div class="content"><div class="title"><div><h1>AI-присутствие</h1><p>Реальный benchmark публичной web-выдачи. Сейчас без API-ключей.</p></div><div class="small">${S.from||'—'} — ${S.to||'—'} · ${agg.totalRuns} успешных запусков</div></div><div class="card filters"><b>Период и география</b><input id="f1" type="date" value="${S.from}"><span>—</span><input id="f2" type="date" value="${S.to}"><select id="fc"><option value="ALL">Все страны</option>${C.map(x=>`<option value="${x[0]}" ${S.filterCountry===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select><button class="btn" id="apply">Применить</button></div><div class="grid five" style="margin-top:14px"><div class="card kpi"><span class="small">Запусков</span><b>${agg.totalRuns}</b></div><div class="card kpi"><span class="small">Упоминание</span><b>${agg.mentionRate}%</b><span class="pill green">${agg.mentionCount}/${agg.totalRuns}</span></div><div class="card kpi"><span class="small">Рекомендация</span><b>${agg.recommendationRate}%</b><span class="pill green">${agg.recommendationCount}/${agg.totalRuns}</span></div><div class="card kpi"><span class="small">Официальный сайт</span><b>${agg.officialCitationRate}%</b><span class="pill green">${agg.officialCitationCount}/${agg.totalRuns}</span></div><div class="card kpi"><span class="small">Средняя позиция</span><b>${agg.averagePosition??'—'}</b></div></div><div class="grid two" style="margin-top:14px"><section class="card"><h3>Производительность запросов</h3><p class="small">Сколько раз каждый запрос дал упоминание и рекомендацию за выбранный период.</p><table class="table"><thead><tr><th>Запрос · страна</th><th>Упомянут</th><th>Рекомендован</th><th>Средняя позиция</th></tr></thead>${qs.length?qs.map((q,i)=>{const r=runsFor(q,rows),st=clientStats(r);return `<tbody><tr class="query" data-i="${i}"><td><b>${esc(q)}</b><span class="small">${esc(r[0]?.market?.countryName||'')}</span></td><td>${st.mentionCount}/${st.totalRuns}<br><span class="small">${st.mentionRate}%</span></td><td>${st.recommendationCount}/${st.totalRuns}<br><span class="small">${st.recommendationRate}%</span></td><td>${st.averagePosition??'—'}</td></tr><tr id="d${i}" class="detail"><td colspan="4"><div class="runs">${r.map(x=>`<div class="run"><b>#${x.runNo}</b><span class="${x.result?.recommended?'green':x.result?.mentioned?'orange':'red'}">${x.result?.recommended?'Рекомендован':x.result?.mentioned?'Упомянут':'Не упомянут'}</span><span>${x.result?.position?'позиция '+x.result.position:'позиция —'}</span><span>${esc(x.checkedAt||x.observedAt||'')}</span></div>`).join('')}</div></td></tr></tbody>`}).join(''):`<tbody><tr><td colspan="4"><div class="empty">Нет данных за выбранный период.</div></td></tr></tbody>`}</table></section><section class="card"><h3>Источники ответов</h3><p class="small">URL, которые реально вернул web search.</p>${src.map(x=>`<div class="source"><a href="${esc(x.url)}" target="_blank">${esc(x.title||x.url)} ↗</a><div class="small">${esc(x.url)}</div></div>`).join('')||'<div class="empty">Источники не найдены.</div>'}</section></div><section class="card custom"><h3>Проверить любой запрос</h3><div class="small">Проверяется в выбранной географии и заданное число раз.</div><div class="row"><input id="cq" placeholder="Например: Лучшие отели Айя-Напы для семей"><select id="cmc">${C.map(x=>`<option value="${x[0]}" ${x[0]===S.marketCountry?'selected':''}>${x[1]}</option>`).join('')}</select><input id="cc" value="${esc(S.marketCity||S.hotel.city||'')}" placeholder="Город"><select id="cr"><option value="1" selected>1</option></select><button class="btn primary" id="runq">Проверить</button></div><div id="cqr"></div></section></div></main></div>`}
function render(){document.getElementById('app').innerHTML=S.audit?dashboard():S.hotel?review():setup();bind()}
function bind(){const g=$('go');if(g)g.onclick=async()=>{const url=$('url').value.trim();if(!url){$('st').innerHTML='<span class="error">Введите официальный URL сайта</span>';return}g.disabled=true;$('st').innerHTML='<div class="loading">Определяем отель, город и страну…</div>';try{const d=await api('/api/discover',{url});S.hotel=d.hotel;S.marketCity=S.hotel.city||'';render()}catch(e){$('st').innerHTML='<span class="error">'+esc(e.message)+'</span>';g.disabled=false}};const b=$('back');if(b)b.onclick=()=>{S.hotel=null;S.audit=null;render()};const a=$('audit');if(a)a.onclick=async()=>{S.marketCountry=$('mc').value;S.marketCity=$('city').value.trim();S.runs=1;a.disabled=true;a.textContent='Проверяем…';try{S.audit=await api('/api/public-audit',{hotel:S.hotel,url:S.hotel.url,runsPerQuery:1,marketCountry:S.marketCountry,marketCountryName:C.find(x=>x[0]===S.marketCountry)?.[1]||S.marketCountry,marketCity:S.marketCity});S.from=new Date(S.audit.observedAt).toISOString().slice(0,10);S.to=S.from;render()}catch(e){alert(e.message);a.disabled=false}};const n=$('new');if(n)n.onclick=()=>{S.audit=null;S.from='';S.to='';render()};const ap=$('apply');if(ap)ap.onclick=()=>{S.from=$('f1').value;S.to=$('f2').value;S.filterCountry=$('fc').value;render()};document.querySelectorAll('.query').forEach(x=>x.onclick=()=>$(('d'+x.dataset.i)).classList.toggle('open'));const rq=$('runq');if(rq)rq.onclick=async()=>{const q=$('cq').value.trim(),mc=$('cmc').value,city=$('cc').value.trim()||S.hotel.city||'',st=$('cqr');if(!q){st.innerHTML='<span class="error">Введите запрос</span>';return}rq.disabled=true;st.innerHTML='<div class="loading">Проверяем web search…</div>';try{const d=await api('/api/public-query',{query:q,runsPerQuery:1,marketCountry:mc,marketCountryName:C.find(x=>x[0]===mc)?.[1]||mc,marketCity:city,hotel:S.hotel});const x=d.aggregate||d.stats;st.innerHTML=`<div class="custom-result"><b>${esc(q)}</b><div class="crgrid"><div class="cr">Упоминание<b>${x.mentionCount}/${x.totalRuns} · ${x.mentionRate}%</b></div><div class="cr">Рекомендация<b>${x.recommendationCount}/${x.totalRuns} · ${x.recommendationRate}%</b></div><div class="cr">Официальный сайт<b>${x.officialCitationCount}/${x.totalRuns} · ${x.officialCitationRate}%</b></div><div class="cr">Средняя позиция<b>${x.averagePosition??'—'}</b></div></div><div class="small" style="margin-top:8px">География: ${esc(d.settings.market.countryName||mc)}${city?', '+esc(city):''} · ${new Date(d.observedAt).toLocaleString('ru-RU')}</div></div>`}catch(e){st.innerHTML='<span class="error">'+esc(e.message)+'</span>'}finally{rq.disabled=false}}}
render();</script></body></html>
