<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIHotel — AI Visibility</title><style>
body{margin:0;font:14px system-ui;background:#f6f7fb;color:#111827}.app{display:flex;min-height:100vh}.side{width:220px;background:#0b1730;color:#fff;padding:20px;box-sizing:border-box;position:fixed;inset:0 auto 0 0}.brand{font-size:20px;font-weight:800;margin-bottom:25px}.nav button{display:block;width:100%;padding:11px;border:0;background:none;color:#b9c3d8;text-align:left;border-radius:9px;margin:3px 0;cursor:pointer}.nav button.active,.nav button:hover{background:#ffffff12;color:#fff}.main{margin-left:220px;width:calc(100% - 220px)}header{height:68px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;padding:0 25px}.content{padding:25px;max-width:1400px;margin:auto}.title{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:18px}h1{margin:0;font-size:28px}.muted{color:#667085;font-size:12px}.grid{display:grid;gap:14px}.four{grid-template-columns:repeat(4,1fr)}.two{grid-template-columns:1.3fr .7fr;margin-top:14px}.three{grid-template-columns:repeat(3,1fr);margin-top:14px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:15px;padding:17px}.kpi b{font-size:27px;display:block;margin-top:7px}.btn{border:1px solid #ddd;background:#fff;padding:9px 13px;border-radius:9px;font-weight:700;cursor:pointer}.primary{background:#5b57f7;color:#fff;border-color:#5b57f7}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px 8px;border-bottom:1px solid #eee;text-align:left;font-size:12px}.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee}.badge{padding:4px 7px;border-radius:99px;font-size:10px;font-weight:800}.yes{background:#e8f8f1;color:#07865c}.no{background:#fff0f0;color:#c63d3d}.warn{background:#fff3e5;color:#b86b10}.action{border:1px solid #e5e7eb;border-radius:10px;padding:11px;margin-top:9px}.setup{max-width:760px;margin:70px auto}.hero{background:#0b1730;color:#fff;border-radius:20px;padding:32px}.form{background:#fff;padding:25px;border-radius:16px;margin:0 25px;position:relative;top:-25px;box-shadow:0 10px 30px #10182812}.field{margin-bottom:15px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}.field input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ddd;border-radius:9px}.drawer{position:fixed;right:0;top:0;bottom:0;width:min(600px,100%);background:#fff;z-index:10;padding:24px;box-sizing:border-box;overflow:auto;box-shadow:-10px 0 30px #0002;display:none}.drawer.open{display:block}.close{float:right;border:0;background:#eee;border-radius:8px;padding:7px}.answer{background:#f8f8ff;padding:13px;border-radius:10px;line-height:1.5;font-size:12px}@media(max-width:900px){.four,.three,.two{grid-template-columns:1fr}.side{width:180px}.main{margin-left:180px;width:calc(100% - 180px)}}@media(max-width:650px){.side{display:none}.main{margin:0;width:100%}.content{padding:15px}}
</style></head><body><div id="app"></div><div id="drawer" class="drawer"></div><script>
const K="aihotel-p0";let s=JSON.parse(localStorage.getItem(K)||"null")||{hotel:null,runs:[],tab:"overview"};const esc=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));const save=()=>localStorage.setItem(K,JSON.stringify(s));const qs=h=>["best hotels in "+h.city,"best hotel for families in "+h.city,"best hotel with parking and breakfast in "+h.city,"best luxury hotel in "+h.city,"best hotel for couples in "+h.city,"best spa hotel in "+h.city,"best business hotel in "+h.city,"best hotel near city center in "+h.city,"pet friendly hotel in "+h.city,"best weekend hotel in "+h.city,"best value hotel in "+h.city,"hotel with airport transfer in "+h.city];
function setup(){return '<div class="setup"><div class="hero"><div class="brand">AIHotel <small>P0</small></div><h1>Measure what AI recommends.</h1><p>Query → AI answer → competitor → sources → action → recheck.</p></div><div class="form"><div class="field"><label>Official hotel website</label><input id="url" placeholder="https://examplehotel.com"></div><button class="btn primary" id="start">Analyze hotel →</button></div></div>'}
function badge(v){return '<span class="badge '+(v?"yes":"no")+'">'+(v?"Yes":"No")+"</span>"}
function dashboard(){let r=s.runs.filter(x=>x.status!=="error"),men=r.filter(x=>x.hotel_mentioned).length,rec=r.filter(x=>x.hotel_recommended).length,comps={},src={};r.forEach(x=>(x.competitors||[]).forEach(c=>comps[c.name]=(comps[c.name]||0)+1));r.forEach(x=>(x.sources||[]).forEach(a=>src[a.domain||a.url]=(src[a.domain||a.url]||0)+1));return '<div class="app"><aside class="side"><div class="brand">AIHotel</div><div class="nav">'+["overview","queries","competitors","sources","actions","profile"].map(t=>'<button class="'+(s.tab===t?"active":"")+'" data-tab="'+t+'">'+t[0].toUpperCase()+t.slice(1)+'</button>').join("")+'</div></aside><main class="main"><header><strong>'+esc(s.hotel.name)+'</strong><div><button class="btn" id="run-openai">Run ChatGPT · 12</button> <button class="btn" id="run-claude">Run Claude · 12</button> <button class="btn primary" id="csv">Export CSV</button></div></header><div class="content">'+view(s.tab,r,men,rec,comps,src)+'</div></main></div>'}
function view(t,r,men,rec,comps,src){if(t==="queries")return '<h1>Query Intelligence</h1><p class="muted">Every row is an observed ChatGPT response.</p><div class="card"><table class="table"><tr><th>Query</th><th>Mention</th><th>Recommend</th><th>Position</th><th>Sources</th></tr>'+r.map((x,i)=>'<tr data-run="'+i+'" class="open"><td>'+esc(x.query)+'</td><td>'+badge(x.hotel_mentioned)+'</td><td>'+badge(x.hotel_recommended)+'</td><td>'+(x.hotel_position??"—")+'</td><td>'+(x.sources||[]).length+'</td></tr>').join("")+'</table></div>';if(t==="competitors")return '<h1>Competitor Intelligence</h1><div class="grid two"><div class="card">'+Object.entries(comps).sort((a,b)=>b[1]-a[1]).map(([n,v])=>'<div class="row"><span>'+esc(n)+'</span><b>'+v+'</b></div>').join("")+'</div><div class="card"><h3>Why competitors win</h3>'+r.flatMap(x=>x.competitors||[]).slice(0,8).map(c=>'<div class="action"><b>'+esc(c.name)+'</b><div class="muted">'+esc(c.reason||"")+'</div></div>').join("")+'</div></div>';if(t==="sources")return '<h1>Source Intelligence</h1><p class="muted">Frequency means observed appearances, not proven causality.</p><div class="card">'+Object.entries(src).sort((a,b)=>b[1]-a[1]).map(([n,v])=>'<div class="row"><span>'+esc(n)+'</span><b>'+v+'</b></div>').join("")+'</div>';if(t==="actions")return '<h1>Opportunities & Action Plan</h1><div class="card">'+(r.flatMap(x=>x.actions||[]).map(a=>'<div class="action"><span class="badge warn">'+esc(a.priority)+'</span><h3>'+esc(a.title)+'</h3><div class="muted">'+esc(a.reason||"")+'</div></div>').join("")||'<p class="muted">Actions appear after real observations.</p>')+'</div>';if(t==="profile")return '<h1>AI-ready Hotel Profile</h1><div class="grid three">'+Object.entries(s.hotel).map(([k,v])=>'<div class="card"><div class="muted">'+esc(k)+'</div><b>'+esc(v)+'</b></div>').join("")+'</div>';return '<div class="title"><div><h1>AI Visibility</h1><p class="muted">'+r.length+' observed ChatGPT responses · '+esc(s.hotel.city)+', '+esc(s.hotel.country)+'</p></div></div>'+(s.errors&&s.errors.length?'<div class="card" style="margin-bottom:14px;border-color:#f1c5c5;background:#fff8f8"><b>'+s.errors.length+' queries failed</b><div class="muted" style="margin-top:5px">'+esc(s.errors[0].error)+'</div></div>':"")+ '<div class="grid four"><div class="card kpi"><span class="muted">Observed runs</span><b>'+r.length+'</b></div><div class="card kpi"><span class="muted">Mention rate</span><b>'+(r.length?Math.round(men/r.length*100):0)+'%</b></div><div class="card kpi"><span class="muted">Recommendation rate</span><b>'+(r.length?Math.round(rec/r.length*100):0)+'%</b></div><div class="card kpi"><span class="muted">Sources observed</span><b>'+Object.keys(src).length+'</b></div></div><div class="grid three"><div class="card"><h3>Top queries</h3>'+r.slice(-5).map(x=>'<div class="row"><span>'+esc(x.query)+'</span><span>'+badge(x.hotel_recommended)+'</span></div>').join("")+'</div><div class="card"><h3>Top competitors</h3>'+Object.entries(comps).sort((a,b)=>b[1]-a[1]).slice(0,5).map(x=>'<div class="row"><span>'+esc(x[0])+'</span><b>'+x[1]+'</b></div>').join("")+'</div><div class="card"><h3>Top sources</h3>'+Object.entries(src).sort((a,b)=>b[1]-a[1]).slice(0,5).map(x=>'<div class="row"><span>'+esc(x[0])+'</span><b>'+x[1]+'</b></div>').join("")+'</div></div>'}
function openRun(i){let x=s.runs[i];document.getElementById("drawer").innerHTML='<button class="close" onclick="closeD()">×</button><h2>'+esc(x.query)+'</h2><p class="muted">'+new Date(x.checked_at).toLocaleString()+'</p><h3>AI answer</h3><div class="answer">'+esc(x.answer||"")+'</div><h3>Hotel result</h3><p>'+badge(x.hotel_mentioned)+' '+(x.hotel_recommended?'<span class="badge yes">Recommended</span>':"")+(x.hotel_position?'<span class="badge warn">Position #'+x.hotel_position+"</span>":"")+'</p><h3>Competitors</h3>'+(x.competitors||[]).map(c=>'<div class="action"><b>'+esc(c.name)+'</b><div class="muted">'+esc(c.reason||"")+'</div></div>').join("")+'<h3>Sources</h3>'+(x.sources||[]).map(a=>'<div class="action"><a href="'+esc(a.url)+'" target="_blank">'+esc(a.title||a.domain||a.url)+'</a></div>').join("")+'<h3>Gaps</h3>'+(x.gaps||[]).map(g=>'<div class="action">'+esc(g)+'</div>').join("");document.getElementById("drawer").classList.add("open")}
function closeD(){document.getElementById("drawer").classList.remove("open")}
async function run(platform){
  let b=document.getElementById(platform==="claude"?"run-claude":"run-openai");
  if(!b)return;
  b.disabled=true;
  b.textContent=platform==="claude"?"Running Claude…":"Running ChatGPT…";
  s.runs=s.runs.filter(x=>(x.platform||"chatgpt")!==platform);
  s.errors=(s.errors||[]).filter(x=>x.platform!==platform);
  save();
  const endpoint=platform==="claude"?"/api/audit-claude":"/api/audit";
  for(const q of qs(s.hotel)){
    try{
      let z=await fetch(endpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({hotel:s.hotel,query:q})});
      let x=await z.json();
      if(!z.ok)throw Error(x.error||"Audit failed");
      x.platform=platform;
      s.runs.push(x);
    }catch(e){
      s.errors.push({platform,query:q,error:e.message});
    }
    save();
    render();
    b=document.getElementById(platform==="claude"?"run-claude":"run-openai");
    if(b){b.disabled=true;b.textContent=platform==="claude"?"Running Claude…":"Running ChatGPT…";}
  }
  b=document.getElementById(platform==="claude"?"run-claude":"run-openai");
  if(b){b.disabled=false;b.textContent=platform==="claude"?"Run Claude · 12":"Run ChatGPT · 12";}
  save();
  render();
}
function render(){document.getElementById("app").innerHTML=s.hotel?dashboard():setup();document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{s.tab=b.dataset.tab;save();render()});let st=document.getElementById("start");if(st)st.onclick=async()=>{let u=document.getElementById("url").value.trim();if(!/^https?:\/\//i.test(u))return alert("Enter valid URL");st.disabled=true;st.textContent="Researching hotel…";try{let z=await fetch("/api/profile",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({url:u})}),p=await z.json();if(!z.ok)throw Error(p.error||"Profile research failed");s.hotel=p;s.runs=[];s.errors=[];save();render();}catch(e){st.disabled=false;st.textContent="Analyze hotel →";alert(e.message)}};let ro=document.getElementById("run-openai");if(ro)ro.onclick=()=>run("chatgpt");let rc=document.getElementById("run-claude");if(rc)rc.onclick=()=>run("claude");document.querySelectorAll(".open").forEach(e=>e.onclick=()=>openRun(Number(e.dataset.run)));let c=document.getElementById("csv");if(c)c.onclick=()=>{let rows=[["platform","query","mentioned","recommended","position"],...s.runs.map(x=>[x.platform||"chatgpt",x.query,x.hotel_mentioned,x.hotel_recommended,x.hotel_position])];let csv=rows.map(r=>r.map(v=>'"'+String(v??"").replaceAll('"','""')+'"').join(",")).join("\n");let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="aihotel.csv";a.click()}}
render();
</script></body></html>
