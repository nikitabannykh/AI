async function api(path,body){
  const c=new AbortController(),t=setTimeout(()=>c.abort(),12000);
  try{
    const r=await fetch(path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body),signal:c.signal});
    const raw=await r.text();let j;try{j=JSON.parse(raw)}catch{throw Error('Сервер вернул некорректный ответ ('+r.status+')')};
    if(!r.ok)throw Error(j.error||('Ошибка API ('+r.status+')'));return j
  }catch(e){if(e&&e.name==='AbortError')throw Error('Сервис отвечает дольше 12 секунд.');throw e}
  finally{clearTimeout(t)}
}

function fld(label,id,value,area){return '<div class="field-box"><label>'+esc(label)+'</label>'+(area?'<textarea id="'+id+'">'+esc(value)+'</textarea>':'<input id="'+id+'" value="'+esc(value)+'">')+'</div>'}
function chip(status){return '<span class="state '+esc(status||'needs-review')+'">'+(status==='ready'?'Готово':'Нужно проверить')+'</span>'}
function contentHead(){const s=contentScore();return '<div class="content-summary"><section class="card"><div class="section"><div><h3>AI Knowledge Base</h3><div class="small">Единая структурированная база: номера, dining, меню, услуги, правила, FAQ и локации. Она станет источником фактов для AI-ответов и будущего guest experience.</div></div><span class="pill">'+s+'% готово</span></div><div class="progress"><span style="width:'+s+'%"></span></div><div class="kicker">Архитектура ориентирована на лучшие guest-journey паттерны: room directory, dining/menus, services, offers и контекстный контент. Отличие AIHotel — контент сразу строится как machine-readable knowledge layer.</div></section><section class="card"><div class="section"><div><h3>Приоритет заполнения</h3><div class="small">Сначала факты, которые чаще всего влияют на ответ AI</div></div></div><div class="checklist"><div class="check"><div>Номера <small>· guests / beds / amenities</small></div><b class="ok">'+(S.content.rooms.every(x=>x.name&&x.guests&&x.bed&&x.amenities)?'✓':'!')+'</b></div><div class="check"><div>Рестораны <small>· cuisine / hours</small></div><b class="ok">'+(S.content.restaurants.every(x=>x.name&&x.cuisine&&x.hours)?'✓':'!')+'</b></div><div class="check"><div>Меню <small>· item / price / tags</small></div><b class="ok">'+(S.content.menus.every(x=>x.restaurant&&x.name&&x.price)?'✓':'!')+'</b></div><div class="check"><div>FAQ <small>· confirmed answers</small></div><b class="ok">'+(S.content.faqs.filter(x=>x.q&&x.a).length>=4?'✓':'!')+'</b></div></div></section></div>'}
function editList(arr,prefix,fields,labels){return arr.map((x,i)=>'<div class="editor-card"><div class="editor-head"><div><div class="editor-title">'+esc(x.name||x.q||'Новая запись')+'</div></div>'+chip(x.status)+'</div><div class="field-grid">'+fields.map(k=>fld(labels[k]||k,prefix+'-'+i+'-'+k,x[k]||'',k==='description'||k==='details'||k==='a')).join('')+'</div></div>').join('')}
function basics(){const b=S.content.basics;return '<section class="card"><div class="section"><div><h3>Основное</h3><div class="small">Canonical profile отеля</div></div><span class="pill">AI-critical</span></div><div class="field-grid">'+fld('Описание для AI','cb-description',b.description,true)+fld('Категория / позиционирование','cb-category',b.category)+fld('Адрес','cb-address',b.address)+fld('Телефон','cb-phone',b.phone)+fld('Email','cb-email',b.email)+fld('Сайт','cb-website',b.website)+fld('Check-in','cb-checkin',b.checkIn)+fld('Check-out','cb-checkout',b.checkOut)+fld('Языки','cb-languages',b.languages)+'</div><div style="display:flex;justify-content:flex-end;margin-top:13px"><button class="btn primary" id="saveBasics">Сохранить</button></div></section>'}
function rooms(){return '<section class="card"><div class="section"><div><h3>Номера</h3><div class="small">Тип номера, вместимость, кровати, вид, ванная, удобства. Позже сюда можно подключить фото, room ID, цены и booking URL.</div></div><button class="btn" id="addRoom">+ Добавить</button></div>'+editList(S.content.rooms,'room',['name','type','area','guests','bed','view','bathroom','amenities','status'],{name:'Название',type:'Тип',area:'Площадь, м²',guests:'Макс. гостей',bed:'Кровать',view:'Вид',bathroom:'Ванная',amenities:'Удобства',status:'Статус'})+'<div style="display:flex;justify-content:flex-end;margin-top:13px"><button class="btn primary" id="saveRooms">Сохранить номера</button></div></section>'}
function restaurants(){return '<section class="card"><div class="section"><div><h3>Рестораны и бары</h3><div class="small">AI должен уметь ответить: где поесть, какая кухня, когда открыто и нужна ли резервация.</div></div><button class="btn" id="addRestaurant">+ Добавить</button></div>'+editList(S.content.restaurants,'rest',['name','type','cuisine','location','hours','reservation','status'],{name:'Название',type:'Тип',cuisine:'Кухня / концепция',location:'Локация',hours:'Часы работы',reservation:'Резервация',status:'Статус'})+'<div style="display:flex;justify-content:flex-end;margin-top:13px"><button class="btn primary" id="saveRestaurants">Сохранить</button></div></section>'}

r"><span style="width:'+x.mention+'%"></span></div></div></div>').join('')+'</div></section></div><section class="card" style="margin-top:14px"><div class="section"><div><h3>Последние ответы AI</h3><div class="small">Как именно модель описывает отель</div></div><button class="btn" id="toAnswers">Все ответы →</button></div><div class="list">'+a.map(x=>'<div class="answer"><div class="answer-head"><div><div class="answer-model">'+x.model+' · '+x.market+'</div><div class="answer-meta">'+esc(x.question)+' · '+x.time+'</div></div><span class="rank">#'+x.rank+'</span></div><div class="answer-text">'+esc(x.text)+'</div><div class="answer-footer">'+x.tags.map(t=>'<span class="chip">'+esc(t)+'</span>').join('')+'</div></div>').join('')+'</div></section>';

function sources(){

function render(){
  if(!S.hotel){document.getElementById('app').innerHTML=setup();bind();return}
  let html=S.tab==='overview'?overview():S.tab==='content'?contentPage():S.tab==='questions'?questions():S.tab==='markets'?markets():S.tab==='competitors'?competitors():S.tab==='answers'?answers():sources();
  document.getElementById('app').innerHTML=html;bind();
}
function bind(){
  const go=$('go');if(go)go.onclick=async()=>{const url=$('url').value.trim();if(!url){$('st').innerHTML='<span class="error">Введите официальный URL.</span>';return}go.disabled=true;$('st').textContent='Читаем официальный сайт…';try{const d=await api('/api/discover',{url});S.hotel=d.hotel;S.tab='overview';save();render()}catch(e){$('st').innerHTML='<span class="error">'+esc(e.message)+'</span>';go.disabled=false}};
  const back=$('back');if(back)back.onclick=()=>{S.hotel=null;save();render()};
  const open=$('open');if(open)open.onclick=()=>{S.tab='overview';render()};
  const nw=$('new');if(nw)nw.onclick=()=>{S.hotel=null;save();render()};
  [['navOverview','overview'],['navContent','content'],['navQuestions','questions'],['navMarkets','markets'],['navCompetitors','competitors'],['navAnswers','answers'],['navSources','sources']].forEach(function(x){const el=$(x[0]);if(el)el.onclick=function(){S.tab=x[1];render()}});
document.querySelectorAll('[data-content-tab]').forEach(function(el){el.onclick=function(){S.contentTab=el.getAttribute('data-content-tab');render()}});
const collect=(prefix,arr,fields)=>arr.forEach((x,i)=>fields.forEach(k=>{const el=$(prefix+'-'+i+'-'+k);if(el)x[k]=el.value}));
const saveBasics=$('saveBasics');if(saveBasics)saveBasics.onclick=()=>{const b=S.content.basics;[['description','cb-description'],['category','cb-category'],['address','cb-address'],['phone','cb-phone'],['email','cb-email'],['website','cb-website'],['checkIn','cb-checkin'],['checkOut','cb-checkout'],['languages','cb-languages']].forEach(p=>b[p[0]]=$(p[1]).value);saveContent();render()};
const saveRooms=$('saveRooms');if(saveRooms)saveRooms.onclick=()=>{collect('room',S.content.rooms,['name','type','area','guests','bed','view','bathroom','amenities','status']);saveContent();render()};
const saveRestaurants=$('saveRestaurants');if(saveRestaurants)saveRestaurants.onclick=()=>{collect('rest',S.content.restaurants,['name','type','cuisine','location','hours','reservation','status']);saveContent();render()};
const saveMenus=$('saveMenus');if(saveMenus)saveMenus.onclick=()=>{collect('menu',S.content.menus,['restaurant','category','name','description','price','tags','status']);saveContent();render()};
const saveServices=$('saveServices');if(saveServices)saveServices.onclick=()=>{collect('svc',S.content.services,['name','type','description','hours','price','booking','status']);saveContent();render()};
const saveFacilities=$('saveFacilities');if(saveFacilities)saveFacilities.onclick=()=>{collect('fac',S.content.facilities,['name','category','location','hours','details']);saveContent();render()};
const savePolicies=$('savePolicies');if(savePolicies)savePolicies.onclick=()=>{const p=S.content.policies;[['children','pol-children'],['pets','pol-pets'],['smoking','pol-smoking'],['cancellation','pol-cancellation'],['parking','pol-parking']].forEach(x=>p[x[0]]=$(x[1]).value);saveContent();render()};
const saveFaqs=$('saveFaqs');if(saveFaqs)saveFaqs.onclick=()=>{collect('faq',S.content.faqs,['q','a','status']);saveContent();render()};
const saveNearby=$('saveNearby');if(saveNearby)saveNearby.onclick=()=>{collect('near',S.content.nearby,['name','type','distance','description']);saveContent();render()};
const add=(key,obj,tab)=>{S.content[key].push(obj);S.contentTab=tab;saveContent();render()};
const addRoom=$('addRoom');if(addRoom)addRoom.onclick=()=>add('rooms',{name:'',type:'',area:'',guests:'2',bed:'',view:'',bathroom:'',amenities:'',status:'needs-review'},'rooms');
const addRestaurant=$('addRestaurant');if(addRestaurant)addRestaurant.onclick=()=>add('restaurants',{name:'',type:'',cuisine:'',location:'',hours:'',reservation:'',status:'needs-review'},'restaurants');
const addMenu=$('addMenu');if(addMenu)addMenu.onclick=()=>add('menus',{restaurant:'',category:'',name:'',description:'',price:'',tags:'',status:'needs-review'},'menus');
const addService=$('addService');if(addService)addService.onclick=()=>add('services',{name:'',type:'',description:'',hours:'',price:'',booking:'',status:'needs-review'},'services');
const addFacility=$('addFacility');if(addFacility)addFacility.onclick=()=>add('facilities',{name:'',category:'',location:'',hours:'',details:''},'facilities');
const addFaq=$('addFaq');if(addFaq)addFaq.onclick=()=>add('faqs',{q:'',a:'',status:'needs-review'},'faqs');
const addNearby=$('addNearby');if(addNearby)addNearby.onclick=()=>add('nearby',{name:'',type:'',distance:'',description:''},'nearby');
  const toAnswers=$('toAnswers');if(toAnswers)toAnswers.onclick=()=>{S.tab='answers';render()};
}
render();

</script>
</body>
</html>
