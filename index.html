function sectionHealth(key){
 const c=S.content;
 const req={basics:[['description','описание'],['category','позиционирование'],['address','адрес'],['phone','телефон'],['email','email'],['languages','языки']],rooms:[['name','название'],['guests','вместимость'],['bed','кровать'],['view','вид'],['amenities','удобства'],['area','площадь'],['photos','фото']],restaurants:[['name','название'],['cuisine','кухня'],['hours','часы'],['mealPeriods','приёмы пищи'],['reservation','резервация'],['photos','фото']],menus:[['restaurant','ресторан'],['category','категория'],['name','название'],['description','описание'],['price','цена'],['ingredients','состав'],['allergens','аллергены'],['modifiers','модификаторы'],['photos','фото']],services:[['name','название'],['description','описание'],['hours','часы'],['price','цена'],['booking','как заказать'],['duration','длительность'],['photos','фото']],facilities:[['name','название'],['category','категория'],['details','описание'],['hours','часы'],['rules','правила'],['photos','фото']],policies:[['children','дети'],['minimumAge','минимальный возраст'],['cancellation','отмена'],['parking','парковка'],['deposit','депозит'],['accessibility','доступность']],faqs:[['q','вопрос'],['a','ответ'],['category','категория'],['source','источник']],nearby:[['name','название'],['type','тип'],['description','описание'],['travelTime','время в пути'],['bestFor','подходит для']]};
 const rows=Array.isArray(c[key])?c[key]:[c[key]||{}]; const need=req[key]||[]; let total=0,ok=0,gaps=[];
 rows.forEach((row,ri)=>need.forEach(([field,label])=>{total++;const val=row[field];const good=field==='photos'?Array.isArray(val)&&val.length>0:!!String(val??'').trim();if(good)ok++;else gaps.push((rows.length>1?'#'+(ri+1)+' · ':'')+label)}));
 return {pct:total?Math.round(ok/total*100):0,gaps};
}

  const body='<div class="card ai-state"><div><div class="eyebrow">AI visibility</div><h2>Отель хорошо виден в коммерческих AI-сценариях</h2><p>Демо показывает, как будет выглядеть реальная аналитика: вопросы, рынки, рекомендации, ответы и источники.</p></div><div class="status"><span class="dot"></span>DEMO</div></div><div class="grid four"><div class="card kpi"><div class="label">AI Visibility</div><div class="value">'+DEMO.overview.visibility+'%</div><div class="hint">'+DEMO.overview.visibilityDelta+' за 30 дней</div></div><div class="card kpi"><div class="label">Рекомендуют</div><div class="value">'+DEMO.overview.recommendation+'%</div><div class="hint">'+DEMO.overview.recommendationDelta+' за 30 дней</div></div><div class="card kpi"><div class="label">AI-обращения</div><div class="value">'+DEMO.overview.questions+'</div><div class="hint">за выбранный период</div></div><div class="card kpi"><div class="label">Рынки</div><div class="value">'+DEMO.overview.markets+'</div><div class="hint">страны / языки</div></div></div><div class="grid two" style="margin-top:14px"><section class="card"><div class="section"><div><h3>Самые частые обращения</h3><div class="small">Demand = внешний поисковый спрос / market signal. AI Visibility = наши контролируемые тесты моделей. Не приватные AI-чаты.</div></div><span class="pill">'+q.length+' из 18</span></div><div class="table-wrap"><table class="table"><thead><tr><th>Вопрос</th><th>Demand</th><th>AI Visibility</th><th>Recommendation</th></tr></thead><tbody>'+q.map(x=>'<tr><td><div class="row-title">'+esc(x.q)+'</div><div class="row-sub">'+esc(x.market)+'</div></td><td><b>'+x.freq.toLocaleString('en-US')+'</b></td><td>'+x.mention+'%</td><td>'+x.recommend+'%</td></tr>').join('')+'</tbody></table></div></section><section class="card"><div class="section"><div><h3>Где AI видит отель</h3><div class="small">Демонстрационная география</div></div></div><div class="list">'+m.map(x=>'<div class="list-item"><div style="flex:1"><div class="country-top"><span>'+esc(x.name)+'</span><b>'+x.mention+'%</b></div><div class="bar"><span style="width:'+x.mention+'%"></span></div></div></div>').join('')+'</div></section></div><section class="card" style="margin-top:14px"><div class="section"><div><h3>Последние ответы AI</h3><div class="small">Как именно модель описывает отель</div></div><button class="btn" id="toAnswers">Все ответы →</button></div><div class="list">'+a.map(x=>'<div class="answer"><div class="answer-head"><div><div class="answer-model">'+x.model+' · '+x.market+'</div><div class="answer-meta">'+esc(x.question)+' · '+x.time+'</div></div><span class="rank">#'+x.rank+'</span></div><div class="answer-text">'+esc(x.text)+'</div><div class="answer-footer">'+x.tags.map(t=>'<span class="chip">'+esc(t)+'</span>').join('')+'</div></div>').join('')+'</div></section>';
  return layout('AI Visibility','Как AI представляет этот отель для потенциального гостя.',body)
}
function questions(){
  const body='<div class="card"><div class="section"><div><h3>Query Universe</h3><div class="small">Сценарии, которые AIHotel генерирует и проверяет. Demand приходит из market/search signals, а AI Visibility — из наших запусков моделей.</div></div><span class="demo">DEMO ДАННЫЕ</span></div><div class="insight" style="margin-bottom:12px"><b>Откуда берутся показатели</b><span><strong>Demand</strong> — оценка внешнего рыночного спроса, а не количество приватных обращений к ChatGPT. <strong>AI Visibility</strong> — доля наших повторных тестов, где отель упомянут/рекомендован, с сохранением полного ответа и источников.</span></div><div class="filter-line"><input class="input" placeholder="Поиск по вопросам"><select class="input"><option>Все страны</option><option>UK</option><option>Germany</option><option>France</option></select><select class="input"><option>Все модели</option><option>ChatGPT</option><option>Claude</option><option>Gemini</option></select></div><div class="table-wrap"><table class="table"><thead><tr><th>#</th><th>Сценарий</th><th>Demand</th><th>AI Visibility</th><th>Recommendation</th><th>Position</th></tr></thead><tbody>'+DEMO.questions.map((x,i)=>'<tr><td><span class="rank">'+(i+1)+'</span></td><td><div class="row-title">'+esc(x.q)+'</div><div class="row-sub">'+esc(x.market)+'</div></td><td><b>'+x.freq.toLocaleString('en-US')+'</b></td><td>'+x.mention+'%</td><td>'+x.recommend+'%</td><td>#'+x.position+'</td></tr>').join('')+'</tbody></table></div></div>';
  return layout('Вопросы','Какие обращения приводят к выбору отеля.',body)
}
function markets(){
  const body='<div class="grid two"><section class="card"><div class="section"><div><h3>AI Visibility по странам</h3><div class="small">Сравнение рынков</div></div></div><div class="list">'+DEMO.markets.map(x=>'<div class="list-item"><div style="flex:1"><div class="country-top"><span>'+esc(x.name)+' · '+esc(x.lang)+'</span><b>'+x.mention+'%</b></div><div class="bar"><span style="width:'+x.mention+'%"></span></div><div class="row-sub">'+x.queries+' вопросов · рекомендация '+x.recommend+'% · '+x.trend+'</div></div></div>').join('')+'</div></section><section class="card"><div class="section"><div><h3>Что это значит</h3><div class="small">Пример продуктового инсайта</div></div></div><div class="insight"><b>UK — сильнейший рынок</b><span>Amarande чаще попадает в рекомендации английских AI-ответов, особенно в сценариях adults-only и luxury.</span></div><div class="insight" style="margin-top:9px"><b>Germany — есть потенциал</b><span>Упоминание хорошее, но конкуренты чаще выигрывают по beach/location запросам.</span></div><div class="insight" style="margin-top:9px"><b>Poland — быстро растёт</b><span>Visibility ниже, но динамика +11%. Стоит усиливать локальный контент и источники.</span></div></section></div><section class="card" style="margin-top:14px"><div class="section"><div><h3>Рынок × вопрос</h3><div class="small">Где теряем видимость</div></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Рынок</th><th>Сильный сценарий</th><th>Слабый сценарий</th><th>Что делать</th></tr></thead><tbody>'+[
['UK','Adults-only','Nissi Beach','Усилить beach proof points'],
['Germany','Luxury couples','Airport / transfer','Добавить немецкие подтверждённые источники'],
['France','Luxury','Romantic','Развить couples content'],
['Poland','Reviews','Family','Показать adult-only positioning']
].map(x=>'<tr><td><b>'+x[0]+'</b></td><td>'+x[1]+'</td><td>'+x[2]+'</td><td>'+x[3]+'</td></tr>').join('')+'</tbody></table></div></section>';
  return layout('Рынки','В каких странах и языках AI рекомендует отель.',body)
}
function competitors(){
  const body='<div class="card"><div class="section"><div><h3>Кого AI ставит рядом</h3><div class="small">Демо-рейтинг конкурентов по AI visibility</div></div><span class="demo">DEMO</span></div><div class="table-wrap"><table class="table"><thead><tr><th>Отель</th><th>AI Visibility</th><th>Рекомендация</th><th>Динамика</th><th>Почему появляется</th></tr></thead><tbody>'+DEMO.competitors.map((x,i)=>'<tr><td><span class="rank">'+(i+1)+'</span> <b>'+x.name+'</b></td><td><b>'+x.visibility+'%</b><div class="bar"><span style="width:'+x.visibility+'%"></span></div></td><td>'+x.recommend+'%</td><td class="delta">'+x.delta+'</td><td>'+x.reason+'</td></tr>').join('')+'</tbody></table></div></div><div class="grid two" style="margin-top:14px"><section class="card"><div class="section"><div><h3>Где проигрываем</h3><div class="small">Демо-инсайты</div></div></div><div class="insight"><b>Nissi Beach</b><span>Adams Beach и другие beachfront properties чаще появляются раньше Amarande.</span></div><div class="insight" style="margin-top:9px"><b>Location / centre</b><span>Napa Plaza сильнее в запросах про центр и nightlife.</span></div></section><section class="card"><div class="section"><div><h3>Наше преимущество</h3><div class="small">Что AI уже понимает</div></div></div><div class="insight"><b>Adults-only</b><span>Сильная и легко распознаваемая категория.</span></div><div class="insight" style="margin-top:9px"><b>Luxury couples</b><span>Хорошо работает в сценариях для пар и премиального отдыха.</span></div></section></div>';
  return layout('Конкуренты','Кого AI рекомендует вместо вашего отеля.',body)
}
function answers(){
  const body='<div class="filter-line"><input class="input" placeholder="Поиск по ответам"><select class="input"><option>Все модели</option><option>ChatGPT</option><option>Claude</option><option>Gemini</option></select><select class="input"><option>Все рынки</option><option>UK</option><option>Germany</option><option>France</option></select></div><div class="list">'+DEMO.answers.map(x=>'<div class="answer"><div class="answer-head"><div><div class="answer-model">'+x.model+' · '+x.market+'</div><div class="answer-meta">'+esc(x.question)+' · '+x.time+'</div></div><span class="rank">#'+x.rank+'</span></div><div class="answer-text">'+esc(x.text)+'</div><div class="answer-footer">'+x.tags.map(t=>'<span class="chip">'+esc(t)+'</span>').join('')+'</div></div>').join('')+'</div>';
  return layout('Ответы AI','Полные ответы моделей — именно то, что видит потенциальный гость.',body)
}
function sources(){
  const body='<div class="grid two"><section class="card"><div class="section"><div><h3>Источники, влияющие на AI</h3><div class="small">Демо-данные</div></div></div><div class="list">'+DEMO.sources.map(x=>'<div class="list-item"><div style="flex:1"><div class="row-title">'+esc(x.domain)+'</div><div class="row-sub">'+esc(x.type)+' · impact '+esc(x.impact)+'</div><div class="bar"><span style="width:'+Math.min(x.used,100)+'%"></span></div></div><b>'+x.used+'%</b></div>').join('')+'</div></section><section class="card"><div class="section"><div><h3>Что делать</h3><div class="small">Пример рекомендаций</div></div></div><div class="insight"><b>Укрепить official source</b><span>Проверить, что позиционирование adults-only / luxury одинаково на всех официальных страницах.</span></div><div class="insight" style="margin-top:9px"><b>Усилить review coverage</b><span>AI часто использует отзывы для выбора между похожими отелями.</span></div><div class="insight" style="margin-top:9px"><b>Добавить editorial proof</b><span>Публикации независимых медиа могут влиять на рекомендации.</span></div></section></div>';
  return layout('Источники','Какие сайты и факты влияют на то, что AI говорит об отеле.',body)
}
function render(){
  if(!S.hotel){document.getElementById('app').innerHTML=setup();bind();return}
  let html=S.tab==='overview'?overview():S.tab==='content'?contentPage():S.tab==='universe'?universe():S.tab==='questions'?questions():S.tab==='markets'?markets():S.tab==='competitors'?competitors():S.tab==='answers'?answers():sources();
  document.getElementById('app').innerHTML=html;bind();
}
function bind(){
  const go=$('go');if(go)go.onclick=async()=>{const url=$('url').value.trim();if(!url){$('st').innerHTML='<span class="error">Введите официальный URL.</span>';return}go.disabled=true;$('st').textContent='Читаем официальный сайт…';try{const d=await api('/api/discover',{url});S.hotel=d.hotel;S.tab='overview';save();render()}catch(e){$('st').innerHTML='<span class="error">'+esc(e.message)+'</span>';go.disabled=false}};
  const back=$('back');if(back)back.onclick=()=>{S.hotel=null;save();render()};
  const open=$('open');if(open)open.onclick=()=>{S.tab='overview';render()};
  const nw=$('new');if(nw)nw.onclick=()=>{S.hotel=null;save();render()};
  [['navOverview','overview'],['navContent','content'],['navUniverse','universe'],['navQuestions','questions'],['navMarkets','markets'],['navCompetitors','competitors'],['navAnswers','answers'],['navSources','sources']].forEach(function(x){const el=$(x[0]);if(el)el.onclick=function(){S.tab=x[1];render()}});
document.querySelectorAll('[data-content-tab]').forEach(function(el){el.onclick=function(){S.contentTab=el.getAttribute('data-content-tab');render()}}); document.querySelectorAll('[data-health-tab]').forEach(function(el){el.onclick=function(){S.contentTab=el.getAttribute('data-health-tab');S.tab='content';render()}}); const openContentFromUniverse=$('openContentFromUniverse');if(openContentFromUniverse)openContentFromUniverse.onclick=()=>{S.tab='content';S.contentTab='rooms';render()};
const collect=(prefix,arr,fields)=>arr.forEach((x,i)=>fields.forEach(k=>{const el=$(prefix+'-'+i+'-'+k);if(el)x[k]=el.value}));
const saveBasics=$('saveBasics');if(saveBasics)saveBasics.onclick=()=>{const b=S.content.basics;[['description','cb-description'],['category','cb-category'],['address','cb-address'],['phone','cb-phone'],['email','cb-email'],['website','cb-website'],['checkIn','cb-checkin'],['checkOut','cb-checkout'],['languages','cb-languages'],['shortDescription','cb-short'],['brandPromise','cb-promise'],['paymentMethods','cb-payment'],['arrivalNotes','cb-arrival']].forEach(p=>{const el=$(p[1]);if(el)b[p[0]]=el.value});saveContent();render()};
const saveRooms=$('saveRooms');if(saveRooms)saveRooms.onclick=()=>{collect('room',S.content.rooms,['name','type','area','guests','adults','children','bed','view','bathroom','balcony','accessible','smoking','crib','amenities','inventory','bookingUrl','status']);saveContent();render()};
const saveRestaurants=$('saveRestaurants');if(saveRestaurants)saveRestaurants.onclick=()=>{collect('rest',S.content.restaurants,['name','type','cuisine','location','hours','mealPeriods','reservation','dressCode','seating','dietary','priceLevel','bookingUrl','status']);saveContent();render()};
const saveMenus=$('saveMenus');if(saveMenus)saveMenus.onclick=()=>{collect('menu',S.content.menus,['restaurant','category','name','description','price','currency','availability','ingredients','allergens','dietary','toppings','modifiers','spicy','tags','status']);saveContent();render()};
const saveServices=$('saveServices');if(saveServices)saveServices.onclick=()=>{collect('svc',S.content.services,['name','type','description','hours','price','booking','duration','leadTime','availability','audience','bookingUrl','photo','status']);saveContent();render()};
const saveFacilities=$('saveFacilities');if(saveFacilities)saveFacilities.onclick=()=>{collect('fac',S.content.facilities,['name','category','location','hours','details','rules','ageLimit','reservation','season']);saveContent();render()};
const savePolicies=$('savePolicies');if(savePolicies)savePolicies.onclick=()=>{const p=S.content.policies;[['children','pol-children'],['minimumAge','pol-minimumAge'],['pets','pol-pets'],['smoking','pol-smoking'],['cancellation','pol-cancellation'],['parking','pol-parking'],['deposit','pol-deposit'],['identification','pol-identification'],['quietHours','pol-quietHours'],['taxes','pol-taxes'],['accessibility','pol-accessibility']].forEach(x=>{const el=$(x[1]);if(el)p[x[0]]=el.value});saveContent();render()};
const saveFaqs=$('saveFaqs');if(saveFaqs)saveFaqs.onclick=()=>{collect('faq',S.content.faqs,['q','category','language','source','a','status']);saveContent();render()};
const saveNearby=$('saveNearby');if(saveNearby)saveNearby.onclick=()=>{collect('near',S.content.nearby,['name','type','distance','travelTime','openingHours','ticket','bestFor','description']);saveContent();render()};
const add=(key,obj,tab)=>{S.content[key].push(obj);S.contentTab=tab;saveContent();render()};
const compressImage=file=>new Promise((resolve,reject)=>{const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{const max=1000;const scale=Math.min(1,max/Math.max(img.width,img.height));const canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,canvas.width,canvas.height);resolve({name:file.name,dataUrl:canvas.toDataURL('image/jpeg',0.72)})};img.onerror=reject;img.src=fr.result};fr.onerror=reject;fr.readAsDataURL(file)});
document.querySelectorAll('[data-photo-key]').forEach(input=>input.onchange=async function(){const key=this.getAttribute('data-photo-key'),i=Number(this.getAttribute('data-photo-index'));const item=S.content[key][i];const existing=item.photos||[];const files=[...this.files].slice(0,6-existing.length);try{const out=await Promise.all(files.map(compressImage));item.photos=existing.concat(out);saveContent();render()}catch(e){alert('Не удалось обработать изображение.')}});
const addRoom=$('addRoom');if(addRoom)addRoom.onclick=()=>add('rooms',{name:'',type:'',area:'',guests:'2',adults:'2',children:'0',bed:'',view:'',bathroom:'',balcony:'',accessible:'',smoking:'Non-smoking',crib:'',amenities:'',inventory:'',bookingUrl:'',photos:[],status:'needs-review'},'rooms');
const addRestaurant=$('addRestaurant');if(addRestaurant)addRestaurant.onclick=()=>add('restaurants',{name:'',type:'',cuisine:'',location:'',hours:'',mealPeriods:'',reservation:'',dressCode:'',seating:'',dietary:'',priceLevel:'',bookingUrl:'',photos:[],status:'needs-review'},'restaurants');
const addMenu=$('addMenu');if(addMenu)addMenu.onclick=()=>add('menus',{restaurant:'',category:'',name:'',description:'',price:'',currency:'EUR',availability:'',ingredients:'',allergens:'',dietary:'',toppings:'',modifiers:'',spicy:'',tags:'',photos:[],status:'needs-review'},'menus');
const addService=$('addService');if(addService)addService.onclick=()=>add('services',{name:'',type:'',description:'',hours:'',price:'',booking:'',duration:'',leadTime:'',availability:'',audience:'',bookingUrl:'',photo:'',photos:[],status:'needs-review'},'services');
const addFacility=$('addFacility');if(addFacility)addFacility.onclick=()=>add('facilities',{name:'',category:'',location:'',hours:'',details:'',rules:'',ageLimit:'',reservation:'',season:'',photos:[]},'facilities');
const addFaq=$('addFaq');if(addFaq)addFaq.onclick=()=>add('faqs',{q:'',a:'',category:'',language:'English',source:'',status:'needs-review'},'faqs');
const addNearby=$('addNearby');if(addNearby)addNearby.onclick=()=>add('nearby',{name:'',type:'',distance:'',travelTime:'',openingHours:'',ticket:'',bestFor:'',description:''},'nearby');
  const toAnswers=$('toAnswers');if(toAnswers)toAnswers.onclick=()=>{S.tab='answers';render()};
}
render();

</script>
</body>
</html>
