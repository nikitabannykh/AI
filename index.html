<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AIHotel — AI Visibility</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--line:#e4e7ee;--text:#171a24;--muted:#717789;--brand:#5b57f7;--brandSoft:#efedff;--dark:#111529;--warn:#a76a00;--warnSoft:#fff4e2}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}
.app{min-height:100vh}.side{position:fixed;left:0;top:0;bottom:0;width:230px;background:var(--dark);color:#fff;padding:20px 14px;display:flex;flex-direction:column}.logo{font-size:21px;font-weight:800;padding:2px 10px 24px}.logo span{color:#8d88ff}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;color:#aeb4c6;text-align:left;padding:11px 12px;border-radius:9px}.nav button.active,.nav button:hover{background:#ffffff12;color:#fff}.side-note{margin-top:auto;color:#737b91;font-size:11px;line-height:1.5;padding:10px}
.main{margin-left:230px;min-height:100vh}.top{height:66px;background:#fff;border-bottom:1px solid var(--line);padding:0 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}.hotel{font-weight:800;max-width:68%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.content{max-width:1480px;margin:auto;padding:27px}
.head{display:flex;align-items:end;justify-content:space-between;gap:18px;margin-bottom:18px}.head h1{margin:0 0 7px;font-size:31px;line-height:1;letter-spacing:-.03em}.head p{margin:0;color:var(--muted)}.small{font-size:11px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}.grid{display:grid;gap:14px}.two{grid-template-columns:1.1fr .9fr}.four{grid-template-columns:repeat(4,1fr)}
.ai-state{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:14px}.eyebrow{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}.ai-state h2{margin:5px 0;font-size:21px}.ai-state p{margin:0;color:var(--muted);line-height:1.45}.status{display:inline-flex;align-items:center;gap:7px;background:var(--warnSoft);color:var(--warn);padding:7px 10px;border-radius:999px;font-size:10px;font-weight:800;white-space:nowrap}.dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.kpi .label{font-size:12px;color:var(--muted)}.kpi .value{font-size:30px;font-weight:800;margin-top:6px}.kpi .hint{font-size:11px;color:var(--muted);margin-top:4px}
.section{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:13px}.section h3{margin:0;font-size:16px}.pill{background:var(--brandSoft);color:var(--brand);border-radius:999px;padding:5px 8px;font-size:10px;font-weight:800}
.empty{border:1px dashed #d7dbe6;border-radius:12px;padding:25px;text-align:center}.empty b{display:block;margin-bottom:6px}.empty p{margin:0;color:var(--muted);font-size:12px;line-height:1.5}
.insight{border:1px solid #eceef4;border-radius:12px;padding:12px}.insight b{display:block}.insight span{display:block;margin-top:4px;color:var(--muted);font-size:11px;line-height:1.45}
.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px 8px;border-bottom:1px solid #eef0f4;text-align:left;font-size:12px;vertical-align:top}.table th{font-size:10px;color:#7b8291}.table tr:last-child td{border-bottom:0}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.input{border:1px solid #d6dae5;background:#fff;border-radius:9px;padding:9px 10px}.btn{border:1px solid #d6dae5;background:#fff;border-radius:9px;padding:9px 13px;font-weight:800;cursor:pointer}.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.setup{max-width:900px;margin:45px auto;padding:22px}.hero{background:var(--dark);color:#fff;border-radius:20px;padding:34px}.hero .logo{padding:0}.hero h1{font-size:42px;line-height:1;letter-spacing:-.04em;margin:22px 0 12px}.hero p{margin:0;color:#c5cada;line-height:1.55;max-width:720px}.setup-card{margin:-16px 20px 0;background:#fff;border:1px solid var(--line);border-radius:17px;padding:22px;box-shadow:0 18px 45px rgba(16,24,40,.08)}.field{margin-bottom:15px}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.setup-input{width:100%;padding:12px;border:1px solid #d5d9e4;border-radius:10px}.help{margin-top:6px;font-size:11px;color:var(--muted);line-height:1.45}.profile{max-width:900px;margin:45px auto;padding:22px}.profile-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}.profile-item{border:1px solid #eef0f4;border-radius:11px;padding:11px}.profile-item .label{font-size:10px;color:var(--muted)}.profile-item .value{font-weight:800;margin-top:4px}.loading{color:var(--muted);padding:9px 0}.error{color:#c64040}
@media(max-width:1050px){.four{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}.profile-grid{grid-template-columns:1fr 1fr}}
@media(max-width:740px){.side{display:none}.main{margin-left:0}.top{padding:0 15px}.content{padding:15px}.head{display:block}.head>div:last-child{margin-top:8px}.ai-state{align-items:flex-start;flex-direction:column}.four{grid-template-columns:1fr 1fr}.profile{padding:10px;margin:20px auto}.setup{padding:10px;margin:20px auto}.hero{padding:24px}.hero h1{font-size:31px}.setup-card{margin:-8px 5px 0;padding:17px}.profile-grid{grid-template-columns:1fr}.two .grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const read=()=>{try{return JSON.parse(localStorage.getItem('aihotel-profile')||'{}')}catch{return{}}};
const old=read();
const S={hotel:old.hotel||null,tab:'overview'};
async function api(path,body){
  const c=new AbortController(),t=setTimeout(()=>c.abort(),12000);
  try{
    const r=await fetch(path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body),signal:c.signal});
    const raw=await r.text();let j;try{j=JSON.parse(raw)}catch{throw Error('Сервер вернул некорректный ответ ('+r.status+')')};
    if(!r.ok)throw Error(j.error||('Ошибка API ('+r.status+')'));return j
  }catch(e){if(e&&e.name==='AbortError')throw Error('Сервис отвечает дольше 12 секунд.');throw e}
  finally{clearTimeout(t)}
}
function save(){localStorage.setItem('aihotel-profile',JSON.stringify({hotel:S.hotel}))}
function setup(){
  return '<div class="setup"><div class="hero"><div class="logo">AIHotel <span>Visibility</span></div><h1>Покажите отелю, как его видит AI.</h1><p>Введите официальный сайт. Мы автоматически найдём название и локацию. После подключения AI-источника здесь появятся реальные обращения, страны, рекомендации, конкуренты и источники.</p></div><div class="setup-card"><div class="field"><label>Официальный сайт</label><input id="url" class="setup-input" placeholder="https://www.examplehotel.com"><div class="help">Только URL. Город и страна вводить не нужно.</div></div><button id="go" class="btn primary">Найти отель →</button><div id="st" class="loading"></div></div></div>'
}
function profile(){
  const h=S.hotel;
  return '<div class="profile"><div class="card"><div class="eyebrow">Hotel profile</div><h2 style="margin:6px 0">Профиль найден</h2><div class="small">Проверьте, что система определила правильный отель.</div><div class="profile-grid"><div class="profile-item"><div class="label">Отель</div><div class="value">'+esc(h.name)+'</div></div><div class="profile-item"><div class="label">Город</div><div class="value">'+esc(h.city||'—')+'</div></div><div class="profile-item"><div class="label">Страна</div><div class="value">'+esc(h.country||'—')+'</div></div><div class="profile-item"><div class="label">Домен</div><div class="value">'+esc(h.host)+'</div></div></div><div class="insight"><b>Следующий шаг</b><span>Подключаем AI-источник и начинаем собирать реальные ответы. Именно эти данные станут основой AI Visibility.</span></div><div style="display:flex;justify-content:space-between;margin-top:15px"><button class="btn" id="back">← Назад</button><button class="btn primary" id="open">Открыть AI Visibility →</button></div></div></div>'
}
function nav(){
  return '<div class="nav"><button id="navOverview" class="'+(S.tab==='overview'?'active':'')+'">◉ Обзор</button><button id="navQuestions" class="'+(S.tab==='questions'?'active':'')+'">⌕ Вопросы</button><button id="navMarkets" class="'+(S.tab==='markets'?'active':'')+'">◌ Рынки</button><button id="navCompetitors" class="'+(S.tab==='competitors'?'active':'')+'">⇄ Конкуренты</button><button id="navSources" class="'+(S.tab==='sources'?'active':'')+'">↗ Источники</button></div>'
}
function layout(title,body){
  return '<div class="app"><aside class="side"><div class="logo">AIHotel <span>Visibility</span></div>'+nav()+'<div class="side-note">Ценность продукта: понимать, как AI представляет отель, где он появляется и почему рекомендует конкурентов.</div></aside><main class="main"><div class="top"><div class="hotel">'+esc(S.hotel.name)+'</div><button class="btn" id="new">↻ Новый отель</button></div><div class="content"><div class="head"><div><h1>'+title+'</h1><p>'+esc(S.hotel.city||'')+', '+esc(S.hotel.country||'')+'</p></div><div class="small">AI data source: не подключён</div></div>'+body+'</div></main></div>'
}
function overview(){
  const body='<div class="card ai-state"><div><div class="eyebrow">Главный статус</div><h2>Реальные AI-данные ещё не подключены</h2><p>Мы не будем показывать выдуманную статистику. Сейчас система знает профиль отеля, но не имеет доступа к реальным AI-ответам.</p></div><div class="status"><span class="dot"></span>NO AI DATA</div></div><div class="grid four"><div class="card kpi"><div class="label">AI Visibility</div><div class="value">—</div><div class="hint">нужны реальные ответы AI</div></div><div class="card kpi"><div class="label">Рекомендация</div><div class="value">—</div><div class="hint">доля ответов с отелем</div></div><div class="card kpi"><div class="label">Популярные вопросы</div><div class="value">—</div><div class="hint">нужны реальные AI-запросы</div></div><div class="card kpi"><div class="label">Страны</div><div class="value">—</div><div class="hint">реальная география AI</div></div></div><div class="grid two" style="margin-top:14px"><section class="card"><div class="section"><div><h3>Что спрашивают про отель</h3><div class="small">Главный будущий отчёт</div></div><span class="pill">AI DATA</span></div><div class="empty"><b>Пока нет реальных AI-запросов</b><p>Здесь появится ranking: вопрос → частота → рынок → AI-модель → упоминание → рекомендация.</p></div></section><section class="card"><div class="section"><div><h3>Откуда идут обращения</h3><div class="small">Реальная география, а не выбранный тестовый рынок</div></div></div><div class="empty"><b>Пока нет данных</b><p>После подключения источника здесь появятся страны, языки и динамика по рынкам.</p></div></section></div><section class="card" style="margin-top:14px"><div class="section"><div><h3>Что сказал AI</h3><div class="small">Каждый ответ должен быть проверяемым</div></div></div><div class="empty"><b>Нет сохранённых ответов</b><p>В полноценной версии здесь будет полный ответ модели, названные конкуренты и конкретные источники, на которые она опиралась.</p></div></section><section class="card" style="margin-top:14px"><div class="section"><div><h3>Что получит отель</h3><div class="small">Измеряем не «красивый score», а причины</div></div></div><div class="grid two"><div class="insight"><b>1. Найдём потерянный спрос</b><span>В каких коммерческих вопросах AI не вспоминает отель.</span></div><div class="insight"><b>2. Найдём конкурентов</b><span>Кого AI выбирает вместо отеля.</span></div><div class="insight"><b>3. Найдём причины</b><span>Какие факты и источники влияют на рекомендацию.</span></div><div class="insight"><b>4. Отследим изменения</b><span>Что меняется по модели, стране и дате.</span></div></div></section></div>';
  return layout('AI Visibility',body)
}
function emptyPage(title,desc){
  return layout(title,'<section class="card"><div class="empty"><b>Раздел готов</b><p>'+desc+'<br><br>Пока AI-источник не подключён, реальные данные здесь отсутствуют.</p></div></section>')
}
function render(){
  if(!S.hotel){document.getElementById('app').innerHTML=setup();bind();return}
  let html=S.tab==='overview'?overview():S.tab==='questions'?emptyPage('Вопросы','Здесь будет список самых популярных AI-обращений к отелю с частотой и долей рекомендации.'):S.tab==='markets'?emptyPage('Рынки','Здесь будет страна × язык × модель × дата, чтобы видеть различия в AI Visibility.'):S.tab==='competitors'?emptyPage('Конкуренты','Здесь будет рейтинг отелей, которых AI рекомендует вместо вашего, с объяснением причин.'):emptyPage('Источники','Здесь будут конкретные страницы и источники, которые AI использовал в ответах.');
  document.getElementById('app').innerHTML=html;bind()
}
function bind(){
  const go=$('go');if(go)go.onclick=async()=>{const url=$('url').value.trim();if(!url){$('st').innerHTML='<span class="error">Введите официальный URL.</span>';return}go.disabled=true;$('st').textContent='Читаем официальный сайт…';try{const d=await api('/api/discover',{url});S.hotel=d.hotel;S.tab='overview';save();render()}catch(e){$('st').innerHTML='<span class="error">'+esc(e.message)+'</span>';go.disabled=false}};
  const back=$('back');if(back)back.onclick=()=>{S.hotel=null;save();render()};
  const open=$('open');if(open)open.onclick=()=>{S.tab='overview';render()};
  const nw=$('new');if(nw)nw.onclick=()=>{S.hotel=null;save();render()};
  [['navOverview','overview'],['navQuestions','questions'],['navMarkets','markets'],['navCompetitors','competitors'],['navSources','sources']].forEach(function(x){const el=$(x[0]);if(el)el.onclick=function(){S.tab=x[1];render()}});
}
render();
</script>
</body>
</html>
