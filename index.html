function orderStats(){
  const raw=(S.orderEvents||[]);
  const ev=raw.filter(x=>x.status!=='cancelled'&&(x.serviceType||'in_room_dining')==='in_room_dining');
  const items=[];
  ev.forEach(o=>(o.items||[]).filter(i=>(i.serviceType||o.serviceType||'in_room_dining')==='in_room_dining').forEach(i=>items.push(Object.assign({},i,{market:o.market,language:o.language,model:o.model,createdAt:o.createdAt,orderId:o.id,request:o.request||'',intent:o.intent||''}))));
  const byItem=new Map(),byCat=new Map(),byModifier=new Map(),byIntent=new Map();
  items.forEach(i=>{
    const k=i.name||i.itemId||'Unknown';
    const v=byItem.get(k)||{name:k,qty:0,revenue:0,orders:0,category:i.category||'',markets:new Set(),models:new Set()};
    v.qty+=i.qty;v.revenue+=i.qty*i.unitPrice;v.orders++;if(i.market)v.markets.add(i.market);if(i.model)v.models.add(i.model);byItem.set(k,v);
    const c=i.category||'Без категории';byCat.set(c,(byCat.get(c)||0)+i.qty);
    (i.modifiers||[]).forEach(m=>{const n=typeof m==='string'?m:(m.name||m.value||'');if(n)byModifier.set(n,(byModifier.get(n)||0)+i.qty)});
    if(i.intent)byIntent.set(i.intent,(byIntent.get(i.intent)||0)+i.qty);
  });
  return{
    orders:ev.length,
    units:items.reduce((a,x)=>a+x.qty,0),
    revenue:ev.reduce((a,x)=>a+Number(x.total||0),0),
    avg:ev.length?ev.reduce((a,x)=>a+Number(x.total||0),0)/ev.length:0,
    cancelled:raw.filter(x=>x.status==='cancelled'&&(x.serviceType||'in_room_dining')==='in_room_dining').length,
    top:[...byItem.values()].sort((a,b)=>b.qty-a.qty).map(x=>Object.assign({},x,{markets:x.markets.size,models:x.models.size})),
    categories:[...byCat.entries()].sort((a,b)=>b[1]-a[1]).slice(0,10),
    modifiers:[...byModifier.entries()].sort((a,b)=>b[1]-a[1]).slice(0,10),
    intents:[...byIntent.entries()].sort((a,b)=>b[1]-a[1]).slice(0,10)
  }
}

const saveRID=$('saveRID');if(saveRID)saveRID.onclick=()=>{const r=S.content.roomDining;[['hours','rid-hours'],['lateSnacks','rid-lateSnacks'],['serviceArea','rid-serviceArea'],['orderChannel','rid-orderChannel'],['orderUrl','rid-orderUrl'],['cutoffTime','rid-cutoffTime'],['deliveryFee','rid-deliveryFee'],['minimumOrder','rid-minimumOrder'],['leadTime','rid-leadTime'],['payment','rid-payment'],['orderingNotes','rid-orderingNotes']].forEach(x=>{const el=$(x[1]);if(el)r[x[0]]=el.value});r.enabled=$('rid-enabled')?.value!=='No';collect('rid',r.items||[],['name','category','description','price','availability','ingredients','allergens','dietary','toppings','modifiers','status']);saveContent();render()};
const addRIDItem=$('addRIDItem');if(addRIDItem)addRIDItem.onclick=()=>{S.content.roomDining.items.push({name:'',category:'',description:'',price:'',availability:'',ingredients:'',allergens:'',dietary:'',toppings:'',modifiers:'',photos:[],status:'needs-review'});S.content.roomDining.categories=[...new Set(S.content.roomDining.items.map(x=>x.category).filter(Boolean))];saveContent();render()};const saveRooms=$('saveRooms');if(saveRooms)saveRooms.onclick=()=>{collect('room',S.content.rooms,['name','type','area','guests','adults','children','bed','view','bathroom','balcony','accessible','smoking','crib','amenities','inventory','bookingUrl','status']);saveContent();render()};
const saveRestaurants=$('saveRestaurants');if(saveRestaurants)saveRestaurants.onclick=()=>{collect('rest',S.content.restaurants,['name','type','cuisine','location','hours','mealPeriods','reservation','dressCode','seating','dietary','priceLevel','bookingUrl','status']);saveContent();render()};
const menuCsv=$('menuCsv');if(menuCsv)menuCsv.onchange=async()=>{const file=menuCsv.files[0];if(!file)return;const rows=demandFromRows([]);const lines=(await file.text()).replace(/\r/g,'').split('\n').filter(x=>x.trim());if(lines.length){const split=line=>line.split(',').map(x=>x.trim().replace(/^"|"$/g,''));const head=split(lines[0]).map(x=>x.toLowerCase());for(const line of lines.slice(1)){const v=split(line),o={};head.forEach((h,j)=>o[h]=v[j]||'');S.content.menus.push({restaurant:o.restaurant||o.rest||'',category:o.category||'',name:o.name||o.item||'',description:o.description||'',price:o.price||'',currency:o.currency||'EUR',availability:o.availability||'',ingredients:o.ingredients||'',allergens:o.allergens||'',dietary:o.dietary||'',toppings:o.toppings||'',modifiers:o.modifiers||'',spicy:o.spicy||'',tags:o.tags||'',photos:[],status:'needs-review'});}}saveContent();render()};const saveMenus=$('saveMenus');if(saveMenus)saveMenus.onclick=()=>{collect('menu',S.content.menus,['restaurant','category','name','description','price','currency','availability','ingredients','allergens','dietary','toppings','modifiers','spicy','tags','status']);saveContent();render()};
const saveServices=$('saveServices');if(saveServices)saveServices.onclick=()=>{collect('svc',S.content.services,['name','type','description','hours','price','booking','duration','leadTime','availability','audience','bookingUrl','photo','status']);saveContent();render()};
const saveFacilities=$('saveFacilities');if(saveFacilities)saveFacilities.onclick=()=>{collect('fac',S.content.facilities,['name','category','location','hours','details','rules','ageLimit','reservation','season']);saveContent();render()};
const savePolicies=$('savePolicies');if(savePolicies)savePolicies.onclick=()=>{const p=S.content.policies;[['children','pol-children'],['minimumAge','pol-minimumAge'],['pets','pol-pets'],['smoking','pol-smoking'],['cancellation','pol-cancellation'],['parking','pol-parking'],['deposit','pol-deposit'],['identification','pol-identification'],['quietHours','pol-quietHours'],['taxes','pol-taxes'],['accessibility','pol-accessibility']].forEach(x=>{const el=$(x[1]);if(el)p[x[0]]=el.value});saveContent();render()};
const saveFaqs=$('saveFaqs');if(saveFaqs)saveFaqs.onclick=()=>{collect('faq',S.content.faqs,['q','category','language','source','a','status']);saveContent();render()};
const saveNearby=$('saveNearby');if(saveNearby)saveNearby.onclick=()=>{collect('near',S.content.nearby,['name','type','distance','travelTime','openingHours','ticket','bestFor','description']);saveContent();render()};
const add=(key,obj,tab)=>{S.content[key].push(obj);S.contentTab=tab;saveContent();render()};
const compressImage=file=>new Promise((resolve,reject)=>{const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{const max=1000;const scale=Math.min(1,max/Math.max(img.width,img.height));const canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,canvas.width,canvas.height);resolve({name:file.name,dataUrl:canvas.toDataURL('image/jpeg',0.72)})};img.onerror=reject;img.src=fr.result};fr.onerror=reject;fr.readAsDataURL(file)});
document.querySelectorAll('[data-photo-key]').forEach(input=>input.onchange=async function(){const key=this.getAttribute('data-photo-key'),i=Number(this.getAttribute('data-photo-index'));const item=key==='roomDiningItems'?S.content.roomDining.items[i]:S.content[key][i];const existing=item.photos||[];const files=[...this.files].slice(0,6-existing.length);try{const out=await Promise.all(files.map(compressImage));item.photos=existing.concat(out);saveContent();render()}catch(e){alert('Не удалось обработать изображение.')}});
const addRoom=$('addRoom');if(addRoom)addRoom.onclick=()=>add('rooms',{name:'',type:'',area:'',guests:'2',adults:'2',children:'0',bed:'',view:'',bathroom:'',balcony:'',accessible:'',smoking:'Non-smoking',crib:'',amenities:'',inventory:'',bookingUrl:'',photos:[],status:'needs-review'},'rooms');
const addRestaurant=$('addRestaurant');if(addRestaurant)addRestaurant.onclick=()=>add('restaurants',{name:'',type:'',cuisine:'',location:'',hours:'',mealPeriods:'',reservation:'',dressCode:'',seating:'',dietary:'',priceLevel:'',bookingUrl:'',photos:[],status:'needs-review'},'restaurants');
const addMenu=$('addMenu');if(addMenu)addMenu.onclick=()=>add('menus',{restaurant:'',category:'',name:'',description:'',price:'',currency:'EUR',availability:'',ingredients:'',allergens:'',dietary:'',toppings:'',modifiers:'',spicy:'',tags:'',photos:[],status:'needs-review'},'menus');
const addService=$('addService');if(addService)addService.onclick=()=>add('services',{name:'',type:'',description:'',hours:'',price:'',booking:'',duration:'',leadTime:'',availability:'',audience:'',bookingUrl:'',photo:'',photos:[],status:'needs-review'},'services');
const addFacility=$('addFacility');if(addFacility)addFacility.onclick=()=>add('facilities',{name:'',category:'',location:'',hours:'',details:'',rules:'',ageLimit:'',reservation:'',season:'',photos:[]},'facilities');
const addFaq=$('addFaq');if(addFaq)addFaq.onclick=()=>add('faqs',{q:'',a:'',category:'',language:'English',source:'',status:'needs-review'},'faqs');
const addNearby=$('addNearby');if(addNearby)addNearby.onclick=()=>add('nearby',{name:'',type:'',distance:'',travelTime:'',openingHours:'',ticket:'',bestFor:'',description:''},'nearby');
  const genU=$('generateUniverse');if(genU)genU.onclick=async()=>{genU.disabled=true;genU.textContent='Считаем…';try{S.universe=await api('/api/query-universe',{hotel:S.hotel,content:S.content,demandData:S.demandData});saveUniverse();render()}catch(e){alert(e.message)}finally{if($('generateUniverse'))$('generateUniverse').disabled=false}};
const clearU=$('clearUniverse');if(clearU)clearU.onclick=()=>{S.universe=null;saveUniverse();render()};
const gscCsv=$('gscCsv');if(gscCsv)gscCsv.onchange=async()=>{const file=gscCsv.files[0];if(!file)return;const rows=demandFromRows(csvParse(await file.text()));S.demandData=S.demandData.concat(rows.map(x=>({...x,source:'Google Search Console import'})));S.universe=S.universe||{};S.universe.sourceStatus=Object.assign({},S.universe.sourceStatus,{searchConsole:'connected'});saveDemand();saveUniverse();render()};
const demandCsv=$('demandCsv');if(demandCsv)demandCsv.onchange=async()=>{const file=demandCsv.files[0];if(!file)return;const rows=demandFromRows(csvParse(await file.text()));S.demandData=S.demandData.concat(rows);S.universe=S.universe||{};S.universe.sourceStatus=Object.assign({},S.universe.sourceStatus,{keywordDemand:'connected'});saveDemand();saveUniverse();render()};
const orderCsv=$('orderCsv');if(orderCsv)orderCsv.onchange=async()=>{const f=orderCsv.files[0];if(!f)return;try{const rows=csvParse(await f.text());const parsed=rows.map(r=>{let items=[];try{items=JSON.parse(r.itemsJson||'[]')}catch{}return {...r,total:Number(r.total||0),items}});ingestOrderEvents(parsed)}catch(e){alert('Не удалось импортировать order events: '+e.message)}};
const runCheck=$('runCheck');if(runCheck)runCheck.onclick=()=>alert(S.monitor.included>0&&S.monitor.used<S.monitor.included?'Проверка будет запущена после подключения AI provider. В demo-режиме запрос не выполняется.':'Лимит проверок исчерпан или тариф не настроен.');const toAnswers=$('toAnswers');if(toAnswers)toAnswers.onclick=()=>{S.tab='answers';render()}; if($('marketMapCanvas'))initMarketMaps();
}
render();
if(S.hotel&&S.crawl.status==='running'&&S.crawl.queue?.length)setTimeout(continueDiscovery,120);

</script>
